name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build app
        run: dotnet build ZidWindowsApps.csproj -c Release
      - name: Build review tool
        run: dotnet build tools/FluentReview/FluentReview.csproj -c Release
